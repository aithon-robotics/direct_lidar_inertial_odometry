/**:
  ros__parameters:

    version: 1.1.1

    adaptive: true

    pointcloud/deskew: true
    pointcloud/voxelize: true

    imu/calibration: true
    imu/intrinsics/accel/bias: [ 0.0, 0.0, 0.0 ]
    imu/intrinsics/accel/sm:   [ 1.,  0.,  0.,
                                 0.,  1.,  0.,
                                 0.,  0.,  1. ]
    imu/intrinsics/gyro/bias: [ 0.0, 0.0, 0.0 ]

    # MID360 mounted upside-down (180deg roll relative to base_link/FLU).
    # Both lidar and IMU are rotated: x stays forward, y and z are flipped.
    # IMU position in LiDAR frame (Livox MID360 user manual): (+11.0, +23.29, -44.12) mm,
    # axes co-aligned with the lidar. Composed with baselink2lidar below (CAD, verified
    # against a Leica MS60 total station, see PR description):
    #   baselink2imu_t = baselink2lidar_t + R_baselink2lidar * lidar2imu_t
    #                  = (0, 0, -0.097) + diag(1,-1,-1) * (0.011, 0.02329, -0.04412)
    #                  = (0.011, -0.02329, -0.05288)
    extrinsics/baselink2imu/t: [ 0.011, -0.02329, -0.05288 ]
    extrinsics/baselink2imu/R: [ 1.,  0.,  0.,
                                 0., -1.,  0.,
                                 0.,  0., -1. ]
    # Mid360 lidar origin is 9.7cm below base_link (CAD), no roll/pitch/yaw offset
    # (mount rotation is identical to the IMU's, since both are inside the
    # same housing). Was -0.03 (6.7cm off vs CAD; see PR description for the
    # total-station/hand-eye validation of this value).
    extrinsics/baselink2lidar/t: [ 0.,  0., -0.097 ]
    extrinsics/baselink2lidar/R: [ 1.,  0.,  0.,
                                   0., -1.,  0.,
                                   0.,  0., -1. ]
