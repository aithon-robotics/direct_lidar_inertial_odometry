/**:
  ros__parameters:

    version: 1.1.1

    adaptive: true

    pointcloud/deskew: true
    pointcloud/voxelize: true

    imu/calibration: true
    imu/intrinsics/accel/bias: [ 0.0, 0.0, 0.0 ]
    imu/intrinsics/accel/sm:   [ 1.,  0.,  0.,
                                 0.,  1.,  0.,
                                 0.,  0.,  1. ]
    imu/intrinsics/gyro/bias: [ 0.0, 0.0, 0.0 ]

    # RoboSense Fairy factory extrinsics (from DIFOP packet, logged at runtime):
    # lidar2imu quaternion qx=0.001760, qy=0.000088, qz=-0.005184, qw=0.999985 (0.63 deg),
    # IMU position (+13.65, +7.82, +4.92) mm in the LiDAR's own frame. Composed here with
    # baselink2lidar below (baselink2imu = baselink2lidar * lidar2imu) since the factory
    # values are relative to the lidar, not base_link. baselink2lidar is the CAD mount
    # pose (verified against a Leica MS60 total station and a hand-eye fit of the
    # Livox/RoboSense relative rotation, see PR description) -- the factory IMU offset
    # itself is unchanged, only the mount it's composed onto.
    extrinsics/baselink2imu/t: [ -0.364283, -0.013150, 0.205343 ]
    extrinsics/baselink2imu/R: [ -0.007194,  0.704576, -0.709592,
                                 -0.999946, -0.010368, -0.000158,
                                 -0.007468,  0.709553,  0.704613 ]
    # Fairy is mounted on the back: yaw -90deg (its own x-axis now points
    # right), then roll +45deg about that already-yawed x-axis (CAD). Lidar origin
    # is 366.334mm back, 0.5mm left and 196.334mm up from base_link.
    # Was t=[-0.28, 0, 0.24] (8.6cm off in x, 4.4cm off in z vs CAD) with a rotation
    # 180deg off about the lidar's own x-axis (x/y axes of the Fairy flipped) --
    # see PR description for the total-station/hand-eye validation of these values.
    extrinsics/baselink2lidar/t: [ -0.366334,  0.0005,  0.196334 ]
    extrinsics/baselink2lidar/R: [ 0.,         0.707107, -0.707107,
                                   -1.,        0.,        0.,
                                    0.,        0.707107,  0.707107 ]
