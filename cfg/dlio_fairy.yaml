/**:
  ros__parameters:

    version: 1.1.1

    adaptive: true

    pointcloud/deskew: true
    pointcloud/voxelize: true

    # Only commit new keyframes to the map while PX4-armed (real-flight config;
    # override with map.gateOnArmState:=false on the command line to test without it).
    map/gateOnArmState: true

    imu/calibration: true
    imu/intrinsics/accel/bias: [ 0.0, 0.0, 0.0 ]
    imu/intrinsics/accel/sm:   [ 1.,  0.,  0.,
                                 0.,  1.,  0.,
                                 0.,  0.,  1. ]
    imu/intrinsics/gyro/bias: [ 0.0, 0.0, 0.0 ]

    # RoboSense Fairy factory extrinsics (from DIFOP packet, logged at runtime):
    # lidar2imu quaternion qx=0.001760, qy=0.000088, qz=-0.005184, qw=0.999985 (0.63 deg),
    # IMU position (+13.65, +7.82, +4.92) mm in the LiDAR's own frame. Composed here with
    # baselink2lidar below (baselink2imu = baselink2lidar * lidar2imu) since the factory
    # values are relative to the lidar, not base_link.
    extrinsics/baselink2imu/t: [ -0.3642834, -0.01315, 0.2053425 ]
    extrinsics/baselink2imu/R: [ -0.0071936,  0.7045761, -0.7095920,
                                 -0.9999462, -0.0103682, -0.0001577,
                                 -0.0074683,  0.7095527,  0.7046128 ]
    # Fairy is mounted on the back: yaw -90deg (its own x-axis now points
    # right), then roll 45deg about that already-yawed x-axis. Lidar origin
    # is 366.334 mm back, 0.5 mm left and 196.334 mm up from base_link.
    extrinsics/baselink2lidar/t: [ -0.366334, 0.0005, 0.196334 ]
    extrinsics/baselink2lidar/R: [ 0.,         0.7071068, -0.7071068,
                                  -1.,         0.,         0.,
                                   0.,         0.7071068,  0.7071068 ]
